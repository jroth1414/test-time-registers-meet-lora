[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ttr"
version = "0.1.0"
description = "Register-aware PEFT: do ViT register artifacts survive LoRA, and do test-time registers repair dense prediction?"
requires-python = ">=3.11"
dependencies = [
  "timm>=1.0.15",
  "omegaconf>=2.3",
  "numpy>=1.26",
  "pillow>=10",
  "pyyaml>=6",
  "pandas>=2.2",
  "scipy>=1.13",
  "matplotlib>=3.9",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
